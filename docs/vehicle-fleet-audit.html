<!doctype html>
<html lang="ru">
  <meta charset="utf-8" /><title>Проверка всего автопарка</title>
  <style>
    body {
      font: 14px system-ui;
      background: #202b33;
      color: #eee;
      margin: 20px;
    }
    a {
      color: #94d6ff;
    }
    nav {
      display: flex;
      gap: 24px;
      margin: 15px 0;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
      gap: 18px;
    }
    article {
      background: #e4e6e8;
      color: #202830;
      padding: 12px;
      border-radius: 8px;
    }
    article a {
      color: #286d97;
    }
    article h2 {
      font-size: 18px;
      margin: 0 0 6px;
    }
    img {
      width: 100%;
      height: 200px;
      object-fit: contain;
      background: #bcc8d0;
    }
    section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    section img {
      height: 170px;
    }
    p {
      margin: 5px 0;
    }
    #capture {
      position: fixed;
      left: -10000px;
      width: 600px;
      height: 300px;
    }
  </style>
  <h1>Весь автопарк: фото, профиль и объём</h1>
  <p>
    Рабочая проверка геометрии. Фотографии разных поколений и комплектаций —
    ориентиры; совпадение деталей ещё требует проверки каждого ракурса.
  </p>
  <nav>
    <a href="?group=sedan">Седаны и хэтчбек</a
    ><a href="?group=suv">Кроссоверы</a
    ><a href="?group=work">Универсал и грузовые</a>
  </nav>
  <p id="status">Подготовка рендеров…</p>
  <main class="grid"></main>
  <canvas id="capture" width="600" height="300"></canvas>
  <script type="module">
    import {
      Engine,
      Scene,
      ArcRotateCamera,
      Vector3,
      Color3,
      Color4,
      HemisphericLight,
      DirectionalLight,
      Camera,
    } from '@babylonjs/core';
    import { createCar, makeEnvironment } from '../game/visuals.ts';
    import { VEHICLE_PROFILES } from '../game/vehicle-profiles.ts';
    import references from './vehicle-references.json';
    const group = new URLSearchParams(location.search).get('group') || 'sedan';
    const canvas = document.querySelector('canvas'),
      engine = new Engine(canvas, true, { preserveDrawingBuffer: true }),
      scene = new Scene(engine);
    makeEnvironment(scene);
    scene.clearColor = new Color4(0.64, 0.7, 0.74, 1);
    const camera = new ArcRotateCamera(
      'camera',
      Math.PI,
      Math.PI / 2,
      8,
      new Vector3(0, 0.7, 0),
      scene,
    );
    const sky = new HemisphericLight('sky', Vector3.Up(), scene);
    sky.intensity = 0.8;
    const sun = new DirectionalLight('sun', new Vector3(0.5, -1, 0.4), scene);
    sun.intensity = 2.2;
    const ids = Object.keys(VEHICLE_PROFILES).filter((id) => {
      const k = VEHICLE_PROFILES[id].kind;
      return group === 'suv'
        ? k === 'suv'
        : group === 'work'
          ? ['truck', 'van', 'wagon'].includes(k)
          : ['sedan', 'hatch', 'sport'].includes(k);
    });
    for (const id of ids) {
      const p = VEHICLE_PROFILES[id],
        ref = references[id],
        card = document.createElement('article');
      card.innerHTML = `<h2>${p.reference}</h2>${ref ? `<img src="${ref.image}" alt="Фотография ${p.reference}"><p><a href="${ref.source}" target="_blank">Источник фотографии</a></p>` : '<p>Собирательное гоночное купе</p>'}<section><div><p>Профиль</p></div><div><p>Три четверти</p></div></section>`;
      document.querySelector('main').append(card);
      const car = createCar(
        scene,
        ref?.color || '#268fba',
        'audit-' + id,
        p.kind,
        false,
        id,
      );
      car.root.position.y = p.rideHeight;
      camera.target.set(0, p.height / 2, 0);
      camera.mode = Camera.ORTHOGRAPHIC_CAMERA;
      camera.alpha = Math.PI;
      camera.beta = Math.PI / 2;
      const hw = p.length * 0.61;
      camera.orthoLeft = -hw;
      camera.orthoRight = hw;
      camera.orthoTop = hw / 2;
      camera.orthoBottom = -hw / 2;
      await scene.whenReadyAsync();
      scene.render();
      const side = document.createElement('img');
      side.alt = p.reference + ' — игровой профиль';
      side.src = canvas.toDataURL();
      card.querySelector('section div').append(side);
      camera.mode = Camera.PERSPECTIVE_CAMERA;
      camera.alpha = 0.9;
      camera.beta = 1.2;
      camera.radius = p.length * 1.42;
      scene.render();
      const angle = document.createElement('img');
      angle.alt = p.reference + ' — игровой объём';
      angle.src = canvas.toDataURL();
      card.querySelectorAll('section div')[1].append(angle);
      car.dispose();
    }
    document.querySelector('#status').textContent =
      `Готово: ${ids.length} моделей`;
    scene.dispose();
    engine.dispose();
  </script>
</html>
