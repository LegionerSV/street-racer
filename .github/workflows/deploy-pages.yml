name: Публикация на GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Сборка сайта
    runs-on: ubuntu-latest
    steps:
      - name: Получение исходников
        uses: actions/checkout@v6

      - name: Настройка Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Проверка типов
        run: npm run typecheck

      - name: Проверка кода
        run: npm run lint

      - name: Запуск тестов
        run: npm test

      - name: Сборка для GitHub Pages
        run: npm run build:pages
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}/

      - name: Настройка GitHub Pages
        uses: actions/configure-pages@v5

      - name: Загрузка готового сайта
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    name: Публикация сайта
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Публикация в GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
